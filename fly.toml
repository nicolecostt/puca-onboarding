# Servidor de Puca no Fly.io: uma máquina sempre ligada (docs/stack.md §5, decisão 0006).
# Chaves só por `fly secrets` (lista em docs/stack.md §13.3); aqui vai só o que é público.
app = "orbis-puca"
primary_region = "iad"

[build]
  dockerfile = "server/Dockerfile"

[deploy]
  # gera no Storage o áudio das falas previsíveis da jornada; o que já está no cache não custa nada
  release_command = "tsx server/scripts/precompute.ts"

[env]
  PORT = "8787"
  # "0" até o app fazer login anônimo e mandar o token (#159); aí volta para "1" (exige token e não sobe sem Supabase).
  # Desligado, o custo fica limitado pelas travas diárias abaixo e pelo limite por IP.
  EXIGE_TOKEN = "0"
  TTS_MODE = "ws"
  ELEVENLABS_MODEL_ID = "eleven_flash_v2_5"
  # travas diárias globais (docs/stack.md §5.3): passou, a rota cai no comportamento sem servidor
  LIMITE_DIARIO_LLM = "1500"
  # alta de propósito para os testes da submissão: quem segura é a cota da ElevenLabs (Starter, 40 mil por mês);
  # depois da avaliação, voltar para algo como 4000
  LIMITE_DIARIO_TTS = "1000000"
  LIMITE_DIARIO_STT = "400"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  method = "GET"
  path = "/api/health"
  interval = "15s"
  timeout = "3s"
  grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
