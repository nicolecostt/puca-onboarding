<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puca — telas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  :root{color-scheme:light}
  body{margin:0;min-height:100vh;background:#f6f6f6;color:#171717;font:14px/1.5 Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px}
  main{width:100%;max-width:480px}
  h1{margin:0 0 4px;font-size:20px;font-weight:600;letter-spacing:-.2px}
  p{margin:0 0 20px;color:#737373}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  a{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #e5e5e5;color:inherit;text-decoration:none;transition:border-color .15s ease}
  a:hover{border-color:#a3a3a3}
  a:focus-visible{outline:2px solid #171717;outline-offset:2px}
  strong{font-weight:500}
  span{font-size:12px;color:#737373}
</style>
</head>
<body>
  <main>
    <h1>Puca</h1>
    <p>Telas do agente de onboarding.</p>
    <ul>
      <li><a href="/src/screens/onboarding-call/"><strong>Call inicial</strong><span>O agente entrevista a pessoa e coleta as infos iniciais.</span></a></li>
      <li><a href="/src/screens/lesson/"><strong>Aula no quadro</strong><span>O agente explica o caminho de uma transação e o quadro se monta junto.</span></a></li>
      <li><a href="/src/screens/live-session/"><strong>Tela de auxílio</strong><span>Barra de call, chat e câmera do agente por cima de uma tela.</span></a></li>
    </ul>
  </main>
</body>
</html>
