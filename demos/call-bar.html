<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Bar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="../src/components/call-bar/call-bar.css">
<link rel="stylesheet" href="../src/components/chat-panel/chat-panel.css">
<link rel="stylesheet" href="../src/components/agent-cam/agent-cam.css">
<style>
  body{margin:0;min-height:100vh;background:#f5f5f5;font-family:Inter,system-ui,sans-serif;color:#0a0a0a}
  /* Tela de fundo só para testar a barra por cima */
  .screen{max-width:1240px;margin:20px auto;min-height:calc(100vh - 140px);background:#fff;border:1px solid #e5e5e5;border-radius:16px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
  .screen h1{margin:0;font-size:clamp(28px,5vw,56px);letter-spacing:-.02em}
  .screen p{margin:0;color:#737373}
  .log{font:12px/1.4 ui-monospace,Menlo,monospace;color:#737373;min-height:1.4em}
</style>
</head>
<body>
  <main class="screen">
    <h1>Tela de teste</h1>
    <p>A barra de call fica flutuando por cima de qualquer tela.</p>
    <div class="log" id="log"></div>
  </main>

<script src="../src/components/chat-panel/chat-panel.js"></script>
<script src="../src/components/call-bar/call-bar.js"></script>
<!-- TESTE: visual da Iris (arquivo fora do git). Sem ele a câmera mostra um círculo neutro. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../src/screens/onboarding-call/iris-teste.js"></script>
<script src="../src/components/agent-cam/agent-cam.js"></script>
<script>
  const chat = ChatPanel.mount();
  const call = CallBar.mount({ status: "Clicking “Compare plans”…", chat });
  const cam = AgentCam.mount({ name: "Iris" });

  // Simula a Iris conversando: fala por um tempo, faz uma pausa, às vezes pensa
  const script = [["talk", 3200], ["idle", 1600], ["talk", 2400], ["think", 1800], ["talk", 3000], ["idle", 2200]];
  let step = 0, paused = false, ended = false;
  (function next() {
    const [s, ms] = script[step++ % script.length];
    if (!paused && !ended) cam.setState(s);
    setTimeout(next, ms);
  })();
  document.addEventListener("callbar:pause", (e) => { paused = e.detail.on; cam.setPaused(paused); });
  document.addEventListener("callbar:end", () => { ended = true; cam.setState("idle"); cam.hide(); });
  document.addEventListener("callbar:start", () => { ended = false; cam.show(); });

  const log = document.getElementById("log");
  ["pause","control","mute","chat","end","start"].forEach(a =>
    document.addEventListener("callbar:" + a, e => {
      log.textContent = `callbar:${a}` + (e.detail.on !== undefined ? ` → ${e.detail.on}` : "");
    })
  );
</script>
</body>
</html>
