<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aula no quadro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
</head>
<body>
  <!-- Topo: marca, aula em andamento (momento atual e tempo) e perfil da demo -->
  <header class="topbar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name">Puca</span>
    </div>
    <div class="callinfo">
      <span class="live" id="live"><span class="live__dot"></span>Live</span>
      <span class="callinfo__label" id="moment-label">Aula</span>
      <span class="callinfo__time" id="timer">00:00</span>
    </div>
    <div class="profile-switch" role="radiogroup" aria-label="Perfil da demonstração">
      <button type="button" class="profile-switch__opt" role="radio" data-vinculo="novo" aria-checked="false">Recém-contratado</button>
      <button type="button" class="profile-switch__opt" role="radio" data-vinculo="transicao" aria-checked="false">Mudando de time</button>
    </div>
  </header>

  <main class="stage">
    <!-- Vista "logo": abertura e encerramento -->
    <section class="logo-view" id="logo-view" hidden>
      <span class="logo-view__mark" aria-hidden="true"></span>
      <h1 class="logo-view__company" id="logo-company"></h1>
      <p class="logo-view__title" id="logo-title"></p>
      <p class="logo-view__who" id="logo-who"></p>
    </section>

    <!-- Vista "quadro": a aula visual -->
    <div class="board-host" id="board-host" hidden></div>

    <!-- Legenda: fala do agente, resposta da pessoa e respostas sugeridas -->
    <section class="caption" aria-live="polite">
      <p class="caption__agent" id="caption-agent"></p>
      <p class="caption__user" id="caption-user"></p>
      <div class="caption__replies" id="replies"></div>
      <p class="caption__hint" id="caption-hint"></p>
    </section>
  </main>

<script type="module" src="./main.ts"></script>
</body>
</html>
