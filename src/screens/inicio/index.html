<!doctype html>
<html lang="pt-BR" data-type="software">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Início · Orbis</title>
<meta name="page-type" content="software">
<meta name="site-kind" content="software">
<meta name="theme-color" content="#ffffff">
<script>
  // Aberto direto como arquivo? Sem o Vite o TypeScript não roda: mostra o caminho certo.
  if (location.protocol === "file:") {
    addEventListener("DOMContentLoaded", function () {
      document.body.innerHTML =
        '<div style="max-width:440px;margin:15vh auto;padding:24px;font:15px/1.6 system-ui,sans-serif;color:#171717;background:#fff;border:1px solid #e5e5e5;border-radius:12px">' +
        "<strong>Esta página precisa do servidor do projeto.</strong><br>" +
        "No terminal, na pasta do projeto, rode <code>npm run dev</code> e abra " +
        '<a href="http://localhost:5173/">http://localhost:5173</a>.</div>';
    });
  }
</script>
</head>
<body>
  <canvas class="particles" id="particles" aria-hidden="true"></canvas>

  <header class="topbar">
    <div class="wrap topbar__row">
      <a class="brand" href="../inicio/" data-orbis-link aria-label="Orbis, início">
        <img class="brand__mark" src="../../assets/orbis-logo.png" alt="" width="26" height="26">
        <span class="brand__name">Orbis</span>
      </a>
      <nav class="home-links" aria-label="Áreas do Orbis">
        <a class="orbis-link" href="../lesson/" data-orbis-link>Rever sessão</a>
        <a class="orbis-link" href="../rh/" data-orbis-link>Painel do RH</a>
      </nav>
    </div>
  </header>

  <main class="wrap page" hidden>
    <section class="profile" aria-label="Seu perfil">
      <div class="profile__text">
        <p class="eyebrow">Sua jornada na Kota</p>
        <h1 class="profile__name" id="name"></h1>
        <p class="profile__role" id="role"></p>
        <div id="puca-call"></div>
      </div>
      <dl class="profile__meta" id="meta"></dl>
    </section>

    <div class="grid">
      <!-- Tarefas -->
      <section class="tasks" aria-labelledby="tasks-title">
        <div class="next-step" id="next-step" hidden></div>
        <h2 id="tasks-title">Suas tarefas</h2>
        <ol class="tasks__list" id="tasks"></ol>
      </section>

      <!-- Ferramentas e acessos -->
      <section class="tools" aria-labelledby="tools-title">
        <h2 id="tools-title">Ferramentas e acessos</h2>
        <div class="notice" id="notice" role="status" aria-live="polite" hidden>
          <span class="notice__orb" id="notice-orb" aria-hidden="true"></span>
          <p class="notice__text" id="notice-text"></p>
        </div>
        <ul class="tools__list" id="tools"></ul>
        <form class="slack-email" id="slack-email" novalidate>
          <label class="slack-email__label" for="slack-email-input">Seu e-mail no Slack da Kota <span>(opcional)</span></label>
          <p class="slack-email__hint">Se eu não souber responder uma dúvida, te mando por mensagem direta lá, dizendo a quem ela iria na Kota.</p>
          <div class="slack-email__row">
            <input class="slack-email__input" id="slack-email-input" type="email" autocomplete="email" placeholder="voce@exemplo.com" />
            <button class="slack-email__save" type="submit">Salvar</button>
          </div>
          <p class="slack-email__status" id="slack-email-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </div>
    <section class="conversas" aria-labelledby="conversas-title">
      <h2 id="conversas-title">Conversas com Puca</h2>
      <div id="conversas"></div>
    </section>
  </main>

  <script type="module" src="./main.ts"></script>
</body>
</html>
