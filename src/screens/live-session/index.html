<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tela de auxílio</title>
<script>
  // Aberto direto como arquivo? Sem o Vite o TypeScript não roda: mostra o caminho certo.
  if (location.protocol === "file:") {
    addEventListener("DOMContentLoaded", function () {
      document.body.innerHTML =
        '<div style="max-width:440px;margin:15vh auto;padding:24px;font:15px/1.6 system-ui,sans-serif;color:#171717;background:#fff;border:1px solid #e5e5e5;border-radius:12px">' +
        "<strong>Esta página precisa do servidor do projeto.</strong><br>" +
        "No terminal, na pasta do projeto, rode <code>npm run dev</code> e abra " +
        '<a href="http://localhost:5173/">http://localhost:5173</a>.</div>';
    });
  }
</script>
</head>
<body>
  <!-- Imitação do Slack da Tail: a "tela qualquer" onde a Puca ajuda.
       Barra de call, chat e câmera da Puca flutuam por cima (main.ts). -->
  <main class="mock" aria-label="Slack da Tail (simulação)">
    <aside class="mock-side">
      <header class="mock-side__ws">
        <span class="mock-side__logo" aria-hidden="true">T</span>
        <strong>Tail</strong>
      </header>
      <nav class="mock-side__nav" id="side"></nav>
    </aside>

    <section class="mock-chan">
      <header class="mock-chan__head">
        <div>
          <h1 class="mock-chan__name"># time-terminais</h1>
          <p class="mock-chan__topic">Maquininhas TailPOS: configuração, firmware e CDN · daily 9h30</p>
        </div>
        <span class="mock-chan__members" aria-label="7 pessoas no canal">7 pessoas</span>
      </header>
      <ol class="mock-msgs" id="msgs"></ol>
      <div class="mock-composer" aria-hidden="true">Mensagem para #time-terminais</div>
    </section>
  </main>

<script type="module" src="./main.ts"></script>
</body>
</html>
