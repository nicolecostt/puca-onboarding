<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call inicial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="../../components/call-bar/call-bar.css">
<link rel="stylesheet" href="../../components/chat-panel/chat-panel.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Topo: marca, call em andamento e tempo -->
  <header class="topbar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name">Primeira Semana</span>
    </div>
    <div class="callinfo">
      <span class="live" id="live"><span class="live__dot"></span>Live</span>
      <span class="callinfo__label">Call inicial</span>
      <span class="callinfo__time" id="timer">00:00</span>
    </div>
    <div class="topbar__right">
      <span class="step" id="step">Passo 1 de 6</span>
    </div>
  </header>

  <main class="stage">
    <!-- O que o agente já anotou -->
    <aside class="notes" aria-labelledby="notes-title">
      <div class="notes__head">
        <h2 id="notes-title">Sobre você</h2>
        <span class="notes__count" id="notes-count">0 de 6</span>
      </div>
      <div class="notes__bar"><span id="notes-bar"></span></div>
      <ul class="notes__list" id="notes-list"></ul>
      <p class="notes__foot">O agente usa isso para montar sua primeira semana. Você pode corrigir qualquer coisa depois.</p>
    </aside>

    <!-- Agente no centro (visual ainda em definição) -->
    <section class="agent" aria-live="polite">
      <div class="agent__orb" id="orb" data-state="idle">
        <span class="agent__ring agent__ring--1"></span>
        <span class="agent__ring agent__ring--2"></span>
        <span class="agent__ring agent__ring--3"></span>
        <div class="agent__core">
          <span class="agent__placeholder">Agente</span>
        </div>
      </div>
      <div class="agent__meta">
        <span class="agent__name">Agente da Primeira Semana</span>
        <span class="agent__state" id="agent-state">Conectando…</span>
      </div>
      <div class="caption">
        <p class="caption__agent" id="caption-agent"></p>
        <p class="caption__user" id="caption-user"></p>
        <p class="caption__hint" id="caption-hint"></p>
      </div>
    </section>
  </main>

<script src="../../components/chat-panel/chat-panel.js"></script>
<script src="../../components/call-bar/call-bar.js"></script>
<!-- TESTE: agente azul (Iris). Não comitar; remover estas duas linhas junto com iris-teste.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="iris-teste.js"></script>
<script src="app.js"></script>
</body>
</html>
