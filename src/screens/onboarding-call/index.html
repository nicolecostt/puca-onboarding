<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call inicial · Orbis</title>
<meta name="theme-color" content="#ffffff">
<script>
  // Aberto direto como arquivo? Sem o Vite o TypeScript não roda: mostra o caminho certo.
  if (location.protocol === "file:") {
    addEventListener("DOMContentLoaded", function () {
      document.body.innerHTML =
        '<div style="max-width:440px;margin:15vh auto;padding:24px;font:15px/1.6 system-ui,sans-serif;color:#171717;background:#fff;border:1px solid #e5e5e5;border-radius:12px">' +
        "<strong>Esta página precisa do servidor do projeto.</strong><br>" +
        "No terminal, na pasta do projeto, rode <code>npm run dev</code> e abra " +
        '<a href="http://localhost:5173/">http://localhost:5173</a>.</div>';
    });
  }
</script>
</head>
<body>
  <canvas class="particles" id="particles" aria-hidden="true"></canvas>

  <!-- Topo: marca, call em andamento e tempo -->
  <header class="topbar">
    <div class="topbar__row">
      <a class="brand" href="../landing/" aria-label="Orbis, início">
        <img class="brand__mark" src="../../assets/orbis-logo.png" alt="" width="26" height="26">
        <span class="brand__name">Orbis</span>
      </a>
      <div class="callinfo">
        <span class="callinfo__dot" aria-hidden="true"></span>
        <span class="callinfo__label">Call inicial</span>
        <span class="callinfo__time" id="timer">00:00</span>
      </div>
      <span class="topbar__right" aria-hidden="true"></span>
    </div>
  </header>

  <main class="stage">
    <!-- Puca à esquerda; à direita, o que ela fala e o que a pessoa responde -->
    <section class="agent" aria-label="Puca">
      <div class="agent__orb" id="orb" data-state="idle">
        <span class="agent__ring agent__ring--1"></span>
        <span class="agent__ring agent__ring--2"></span>
        <span class="agent__ring agent__ring--3"></span>
        <div class="agent__core">
          <span class="agent__placeholder">Puca</span>
        </div>
      </div>
      <div class="agent__meta">
        <span class="agent__name">Puca</span>
        <span class="agent__state" id="agent-state">Conectando…</span>
      </div>
    </section>

    <section class="caption" aria-live="polite" aria-label="Conversa">
      <p class="caption__agent" id="caption-agent"></p>
      <p class="caption__user" id="caption-user"></p>
      <p class="caption__hint" id="caption-hint"></p>
    </section>
  </main>

<script type="module" src="./main.ts"></script>
</body>
</html>
