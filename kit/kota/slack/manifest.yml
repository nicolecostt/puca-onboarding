display_information:
  name: Orbis
  description: Integração do Orbis com o Slack da Kota. Preenche os canais dos times e leva os encaminhamentos de Puca.
  background_color: "#1f2937"
features:
  bot_user:
    display_name: orbis
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.customize
      - channels:manage
      - im:write
      - users:read
      - users:read.email
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
