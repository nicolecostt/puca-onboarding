# Sobe o servidor do Puca no Fly.io (docs/stack.md §5.2) a cada push na main que muda o que entra na imagem.
# Também roda à mão: Actions → Deploy do servidor → Run workflow (branch main).
# Precisa do segredo FLY_API_TOKEN no repositório (token de deploy só deste app: `fly tokens create deploy -a orbis-puca`).
name: Deploy do servidor

on:
  push:
    branches: [main]
    # O que o server/Dockerfile copia e o servidor importa (server/src/server.ts e server/scripts/precompute.ts).
    # Se o servidor passar a importar outra pasta de src/, acrescente aqui.
    paths:
      - server/**
      - kit/kota/**
      - src/data/**
      - src/journey/**
      - src/lib/**
      - src/voice/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - fly.toml
      - .github/workflows/deploy-servidor.yml
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez; se chegar outro merge no meio, ele espera e sobe a versão mais nova depois.
concurrency:
  group: deploy-servidor
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: flyctl deploy --remote-only --app orbis-puca
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Servidor respondendo
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://orbis-puca.fly.dev/api/health
